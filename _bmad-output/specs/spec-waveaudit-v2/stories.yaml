# Ordre (liste = ordre d'exécution ; dépendances dans chaque invoke_dev_with) :
#   vague 0 : S0 seule (AD-18), intégrée, suite verte sur main ;
#   vague 1 : Q1, Q2, R1, M1, X1, W1 en parallèle (fichiers disjoints) ;
#   vague 2 : Q3 (après Q2), W5 (après W1) ;
#   vague 3 : Q4 (après Q3), L1 (après Q1, Q2, Q3, X1) ;
#   vague 4 : B1 (après L1), R2 (après R1, M1, L1) ;
#   vague 5 : Q5 rebanc EliteBook (après Q4, B1), X2 (après X1, R2, B1), W2 (après W5, R2, M1, L1) ;
#   vague 6 : W3a (après W2, X2), W4 (après W2) ;
#   vague 7 : W3b (après W3a, W4) ; puis DOC ; puis REC (recette EliteBook).
# Collisions tenues par l'ordre (impacts-v2.md) : catalogue YAML Q3 puis Q4 ; prompt.py et
# pipeline.py Q1 puis L1 puis Q5 ; lot.py S0 puis L1 puis R2 ; app.py W1 (routeurs) puis W5,
# W2, puis W3a et W4 (un routeur chacun), puis W3b ; style.css W5, W2, W4, W3b en séquence.
# composition.py (Q1, B1, X2, W2, W4) et cli.py (L1, B1, X2) : ajouts de fonctions ou de
# commandes seulement, en fin de bloc ; X2 et W2 peuvent se croiser sur composition.py :
# conflit d'adjacence résolu à l'intégration, jamais en réécrivant la fonction de l'autre.
# Contrat commun : SPEC.md, formats.md, mesures-qualite.md, ecarts-contrat.md ; contrats.md
# (normatif, sections [v2] et §23 à §30) ; ARCHITECTURE-SPINE.md AD-18 à AD-23 ;
# impacts-v2.md (table des tests) ; EXPERIENCE.md et DESIGN.md pour les écrans.
# Après S0, aucune story ne modifie les fichiers du socle (AD-0 v2) : un manque s'arrête et se
# signale. Exceptions nommées d'AD-18 : Q4 (valeurs k1, b) et Q5 (role, repeat_penalty,
# duree_indicative_s du manifeste). Aucun test sur le vrai modèle ni le réseau hors `slow`.
# Pièges Windows communs : écriture atomique `.partiel` puis os.replace retenté sur
# PermissionError (lecteur concurrent, Word ouvert) ; encoding="utf-8" explicite partout ;
# noms de fichiers comparés en casefold, Path.name seulement, jamais de chemin absolu dans un
# message (sans_chemin) ; aucun test ne dépend de l'heure ou de l'année courante ; minuteries
# de test courtes (0,1 s) et attentes par sondage borné, jamais de sleep fixe long ; fils
# daemon et verrous libérés dans un finally ; TestClient : jeton CSRF posé par
# tests/web_outils.py dès W1.
