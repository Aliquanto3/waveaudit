- id: AUTRE-JOURNALISATION-INSUFFISANTE
  titre: Journalisation et détection insuffisantes
  famille: autre
  mots_cles:
    - journalisation insuffisante
    - logs absents
    - détection tardive
    - siem non alimenté
    - absence d'alerte
    - traçabilité manquante
    - supervision de sécurité
    - insufficient logging
    - security monitoring
  description: >-
    Les événements de sécurité significatifs (connexions, échecs
    d'authentification, actions d'administration) ne sont pas journalisés
    de façon exploitable ou ne sont remontés à aucun dispositif de
    supervision.
  impact: >-
    Détection tardive voire absente d'une intrusion, et difficulté à
    reconstituer le déroulement d'un incident après coup.
  recommandation: >-
    Journaliser les événements de sécurité clés de façon centralisée et
    horodatée, et mettre en place des alertes sur les comportements
    anormaux.
  cvss_vecteur: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:L/A:N
  references:
    - id: CWE-778
      titre: Insufficient Logging
      url: https://cwe.mitre.org/data/definitions/778.html
    - id: "A09:2021"
      titre: Security Logging and Monitoring Failures
      url: https://owasp.org/Top10/A09_2021-Security_Logging_and_Monitoring_Failures/
  source: "Rédaction WaveAudit d'après CWE-778 et OWASP Top 10 A09:2021, licence du dépôt"
