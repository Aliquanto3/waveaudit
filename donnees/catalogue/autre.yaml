- id: AUTRE-JOURNALISATION-INSUFFISANTE
  titre: Journalisation et détection insuffisantes
  famille: autre
  mots_cles:
    - journalisation insuffisante
    - logs absents
    - détection tardive
    - siem non alimenté
    - absence d'alerte
    - traçabilité manquante
    - supervision de sécurité
    - insufficient logging
    - security monitoring
  description: >-
    Les événements de sécurité significatifs (connexions, échecs
    d'authentification, actions d'administration) ne sont pas journalisés
    de façon exploitable ou ne sont remontés à aucun dispositif de
    supervision.
  impact: >-
    Détection tardive voire absente d'une intrusion, et difficulté à
    reconstituer le déroulement d'un incident après coup.
  recommandation: >-
    Journaliser les événements de sécurité clés de façon centralisée et
    horodatée, et mettre en place des alertes sur les comportements
    anormaux.
  en:
    titre: Insufficient logging and detection
    description: >-
      Significant security events (logins, failed authentications,
      administrative actions) are not logged in a usable way, or are not
      forwarded to any monitoring system.
    impact: >-
      Late or absent detection of an intrusion, and difficulty
      reconstructing the course of an incident afterwards.
    recommandation: >-
      Log key security events centrally with timestamps, and set up
      alerts for abnormal behaviour.
  cvss_vecteur: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:L/A:N
  references:
    - id: CWE-778
      titre: Insufficient Logging
      url: https://cwe.mitre.org/data/definitions/778.html
    - id: "A09:2021"
      titre: Security Logging and Monitoring Failures
      url: https://owasp.org/Top10/A09_2021-Security_Logging_and_Monitoring_Failures/
  source: "Rédaction WaveAudit d'après CWE-778 et OWASP Top 10 A09:2021, licence du dépôt"

- id: AUTRE-MFA-ABSENTE
  titre: Absence d'authentification multifacteur sur les accès sensibles
  famille: autre
  mots_cles:
    - absence de mfa
    - multi-factor authentication absente
    - authentification à facteur unique
    - single factor authentication
    - accès vpn sans second facteur
    - compromission de mot de passe seul
    - second facteur non déployé
  description: >-
    Les accès sensibles (VPN, portail d'administration, compte à
    privilèges) ne requièrent qu'un mot de passe, sans second facteur
    d'authentification.
  impact: >-
    Compromission du compte à la seule obtention du mot de passe, par
    phishing, fuite de données ou réutilisation d'identifiants.
  recommandation: >-
    Déployer une authentification multifacteur sur les accès sensibles, en
    priorité pour les comptes à privilèges et les accès distants.
  en:
    titre: Missing multi-factor authentication on sensitive access
    description: >-
      Sensitive access points (VPN, administration portal, privileged
      account) require only a password, without a second authentication
      factor.
    impact: >-
      Account compromise as soon as the password alone is obtained,
      through phishing, a data leak, or credential reuse.
    recommandation: >-
      Deploy multi-factor authentication on sensitive access points,
      starting with privileged accounts and remote access.
  cvss_vecteur: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N
  references:
    - id: CWE-308
      titre: Use of Single-factor Authentication
      url: https://cwe.mitre.org/data/definitions/308.html
    - id: "A07:2021"
      titre: Identification and Authentication Failures
      url: https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/
  source: "Rédaction WaveAudit d'après CWE-308 et OWASP Top 10 A07:2021, licence du dépôt"
