- id: CONFIG-MOT-DE-PASSE-DEFAUT
  titre: Identifiants par défaut non modifiés
  famille: config
  mots_cles:
    - mot de passe par défaut
    - default credentials
    - admin/admin
    - identifiant constructeur
    - compte usine
    - credentials par défaut non changés
  description: >-
    Un équipement ou une application reste accessible avec les identifiants
    fournis par défaut par l'éditeur ou le constructeur, jamais changés
    depuis l'installation.
  impact: >-
    Accès immédiat avec des privilèges complets, ces identifiants étant
    publiquement documentés.
  recommandation: >-
    Changer systématiquement les identifiants par défaut lors de la mise en
    service et interdire leur réutilisation via la politique de mots de
    passe.
  en:
    titre: Default credentials left unchanged
    description: >-
      A device or application remains reachable with the credentials
      shipped by the vendor or manufacturer, never changed since
      installation.
    impact: >-
      Immediate access with full privileges, since these credentials are
      publicly documented.
    recommandation: >-
      Systematically change default credentials during deployment and
      forbid their reuse through the password policy.
  cvss_vecteur: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
  references:
    - id: CWE-1392
      titre: Use of Default Credentials
      url: https://cwe.mitre.org/data/definitions/1392.html
  source: "Rédaction WaveAudit d'après CWE-1392, licence du dépôt"

- id: CONFIG-SECRETS-EN-CLAIR
  titre: Secrets stockés en clair
  famille: config
  mots_cles:
    - secret en clair
    - mot de passe en clair
    - clé api en clair
    - fichier de configuration lisible
    - .env versionné
    - hardcoded secret
    - clé privée exposée
  description: >-
    Un mot de passe, une clé d'API ou une clé privée est stocké en texte
    clair dans un fichier de configuration, un script ou un dépôt de code,
    sans chiffrement ni gestionnaire de secrets.
  impact: >-
    Récupération immédiate du secret par quiconque accède au fichier, au
    dépôt ou à une sauvegarde de celui-ci.
  recommandation: >-
    Déplacer les secrets vers un gestionnaire dédié (coffre-fort,
    variables d'environnement protégées) et purger l'historique de
    versionnage le cas échéant.
  en:
    titre: Secrets stored in cleartext
    description: >-
      A password, API key, or private key is stored as plain text in a
      configuration file, a script, or a code repository, without
      encryption or a secrets manager.
    impact: >-
      Immediate recovery of the secret by anyone who accesses the file,
      the repository, or a backup of it.
    recommandation: >-
      Move secrets to a dedicated manager (vault, protected environment
      variables) and purge the version history where applicable.
  cvss_vecteur: CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N
  references:
    - id: CWE-312
      titre: Cleartext Storage of Sensitive Information
      url: https://cwe.mitre.org/data/definitions/312.html
  source: "Rédaction WaveAudit d'après CWE-312, licence du dépôt"

- id: CONFIG-LISTAGE-REPERTOIRE
  titre: Listage de répertoire activé
  famille: config
  mots_cles:
    - listage de répertoire
    - directory listing
    - autoindex
    - index automatique de dossier
    - fichiers de sauvegarde exposés
    - navigation de répertoire
  description: >-
    Le serveur web renvoie la liste des fichiers d'un répertoire lorsque
    aucune page d'index n'est présente, exposant son contenu.
  impact: >-
    Découverte de fichiers non destinés à être publics (sauvegardes,
    sources, journaux) facilitant d'autres attaques.
  recommandation: >-
    Désactiver le listage automatique de répertoire sur le serveur web et
    retirer les fichiers sensibles du répertoire public.
  en:
    titre: Directory listing enabled
    description: >-
      The web server returns the list of files in a directory when no
      index page is present, exposing its contents.
    impact: >-
      Discovery of files not meant to be public (backups, source code,
      logs), facilitating further attacks.
    recommandation: >-
      Disable automatic directory listing on the web server and remove
      sensitive files from the public directory.
  cvss_vecteur: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
  references:
    - id: CWE-548
      titre: Exposure of Information Through Directory Listing
      url: https://cwe.mitre.org/data/definitions/548.html
  source: "Rédaction WaveAudit d'après CWE-548, licence du dépôt"

- id: CONFIG-DEBUG-ACTIF
  titre: Mode de débogage actif en production
  famille: config
  mots_cles:
    - mode debug
    - debug actif en production
    - stack trace détaillée
    - console interactive exposée
    - flag debug=true
    - profiler accessible
  description: >-
    L'application tourne avec le mode de débogage activé en environnement
    de production, exposant des informations internes détaillées, parfois
    une console interactive, en cas d'erreur.
  impact: >-
    Divulgation d'informations internes voire exécution de code via une
    console de débogage accessible depuis l'extérieur.
  recommandation: >-
    Désactiver le mode de débogage en production et vérifier la
    configuration des environnements de déploiement.
  en:
    titre: Debug mode active in production
    description: >-
      The application runs with debug mode enabled in the production
      environment, exposing detailed internal information, sometimes an
      interactive console, when an error occurs.
    impact: >-
      Disclosure of internal information or even code execution through a
      debug console reachable from outside.
    recommandation: >-
      Disable debug mode in production and check the configuration of the
      deployment environments.
  cvss_vecteur: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N
  references:
    - id: CWE-489
      titre: Active Debug Code
      url: https://cwe.mitre.org/data/definitions/489.html
  source: "Rédaction WaveAudit d'après CWE-489, licence du dépôt"

- id: CONFIG-SAUVEGARDE-EXPOSEE
  titre: Fichier de sauvegarde accessible publiquement
  famille: config
  mots_cles:
    - sauvegarde exposée
    - backup exposé
    - fichier .bak téléchargeable
    - archive de sauvegarde publique
    - dump de base accessible
    - fichier de sauvegarde oublié
    - backup file disclosure
  description: >-
    Un fichier de sauvegarde (archive, export de base de données, fichier
    `.bak`) reste accessible publiquement sur le serveur web, souvent
    oublié après une opération de maintenance.
  impact: >-
    Divulgation complète du contenu sauvegardé, incluant parfois des
    identifiants ou des données personnelles.
  recommandation: >-
    Stocker les sauvegardes hors du répertoire public servi par le serveur
    web et vérifier régulièrement l'absence de fichiers oubliés.
  en:
    titre: Publicly accessible backup file
    description: >-
      A backup file (archive, database export, `.bak` file) remains
      publicly accessible on the web server, often forgotten after a
      maintenance operation.
    impact: >-
      Full disclosure of the backed-up content, sometimes including
      credentials or personal data.
    recommandation: >-
      Store backups outside the public directory served by the web
      server and regularly check for forgotten files.
  cvss_vecteur: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
  references:
    - id: CWE-530
      titre: Exposure of Backup File to an Unauthorized Control Sphere
      url: https://cwe.mitre.org/data/definitions/530.html
  source: "Rédaction WaveAudit d'après CWE-530, licence du dépôt"

- id: CONFIG-CORS-DEBUG
  titre: Configuration CORS de débogage laissée active en production
  famille: config
  mots_cles:
    - cors de debug
    - configuration cors de développement
    - wildcard cors en production
    - access-control-allow-origin *
    - profil de configuration non adapté
    - debug cors enabled
    - origine de développement autorisée
  description: >-
    Le profil de configuration utilisé en production conserve les réglages
    CORS permissifs prévus pour le développement, autorisant toute origine
    à consommer l'API.
  impact: >-
    Exposition de l'API à des requêtes cross-origin non prévues en
    production, facilitant l'exfiltration de données par un site tiers.
  recommandation: >-
    Séparer explicitement les profils de configuration CORS par
    environnement et vérifier le profil effectivement chargé en
    production.
  en:
    titre: Debug CORS configuration left active in production
    description: >-
      The configuration profile used in production keeps the permissive
      CORS settings meant for development, allowing any origin to
      consume the API.
    impact: >-
      Exposes the API to cross-origin requests never intended for
      production, facilitating data exfiltration by a third-party site.
    recommandation: >-
      Explicitly separate CORS configuration profiles per environment and
      check which profile is actually loaded in production.
  cvss_vecteur: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:N/A:N
  references:
    - id: CWE-942
      titre: Permissive Cross-domain Policy with Untrusted Domains
      url: https://cwe.mitre.org/data/definitions/942.html
  source: "Rédaction WaveAudit d'après CWE-942, licence du dépôt"
