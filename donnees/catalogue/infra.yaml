- id: INFRA-SMB-SIGNATURE
  titre: Signature SMB non exigée
  famille: infra
  mots_cles:
    - signature smb
    - smb signing
    - relais ntlm
    - ntlm relay
    - responder
    - man-in-the-middle smb
    - impacket ntlmrelayx
  description: >-
    Un serveur accepte des sessions SMB sans exiger la signature des
    messages, ce qui permet à un attaquant positionné sur le réseau de
    relayer une authentification NTLM interceptée vers ce serveur.
  impact: >-
    Exécution de commandes ou accès à des partages avec les privilèges du
    compte dont l'authentification a été relayée.
  recommandation: >-
    Exiger la signature SMB sur les serveurs et les postes sensibles,
    particulièrement les contrôleurs de domaine, et limiter les protocoles
    de résolution de noms vulnérables au relais.
  cvss_vecteur: CVSS:3.1/AV:A/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N
  references:
    - id: CWE-300
      titre: Channel Accessible by Non-Endpoint
      url: https://cwe.mitre.org/data/definitions/300.html
  source: "Rédaction WaveAudit d'après CWE-300, licence du dépôt"

- id: INFRA-SERVICE-OBSOLETE
  titre: Service réseau obsolète ou non maintenu
  famille: infra
  mots_cles:
    - service obsolète
    - version non supportée
    - end of life
    - correctif manquant
    - bannière de version
    - vulnérabilité publique connue
    - nmap -sv
  description: >-
    Un service exposé exécute une version ancienne, en fin de support ou
    connue pour des vulnérabilités publiées, faute de mise à jour ou de
    remplacement planifié.
  impact: >-
    Exploitation directe de vulnérabilités publiques, souvent documentées
    avec un code de démonstration disponible.
  recommandation: >-
    Mettre à jour ou remplacer le service par une version maintenue, et
    planifier un cycle de gestion des correctifs.
  cvss_vecteur: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H
  references:
    - id: CWE-1104
      titre: Use of Unmaintained Third Party Components
      url: https://cwe.mitre.org/data/definitions/1104.html
  source: "Rédaction WaveAudit d'après CWE-1104, licence du dépôt"

- id: INFRA-SNMP-COMMUNAUTE
  titre: Communauté SNMP par défaut ou faible
  famille: infra
  mots_cles:
    - snmp communauté
    - community string public
    - snmpwalk
    - snmp v1 v2c
    - mot de passe snmp par défaut
    - divulgation de configuration réseau
  description: >-
    Un équipement répond aux requêtes SNMP avec une communauté par défaut
    (`public`, `private`) ou devinable, en version 1 ou 2c sans
    authentification forte.
  impact: >-
    Divulgation de la configuration réseau, des tables de routage et parfois
    modification de la configuration de l'équipement.
  recommandation: >-
    Changer les communautés par défaut, migrer vers SNMPv3 avec
    authentification et chiffrement, ou désactiver SNMP si inutilisé.
  cvss_vecteur: CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N
  references:
    - id: CWE-1392
      titre: Use of Default Credentials
      url: https://cwe.mitre.org/data/definitions/1392.html
  source: "Rédaction WaveAudit d'après CWE-1392, licence du dépôt"

- id: INFRA-RDP-EXPOSE
  titre: Bureau à distance exposé sans restriction
  famille: infra
  mots_cles:
    - rdp exposé
    - remote desktop protocol
    - port 3389 ouvert
    - bruteforce rdp
    - network level authentication absente
    - accès distant non filtré
  description: >-
    Le service de bureau à distance est accessible depuis un réseau non
    maîtrisé (Internet ou un réseau interne large) sans restriction d'accès
    ni authentification réseau préalable.
  impact: >-
    Exposition à des attaques par force brute et à l'exploitation de
    vulnérabilités du protocole, pouvant conduire à une prise de contrôle du
    poste ou serveur.
  recommandation: >-
    Restreindre l'accès RDP par liste blanche ou VPN, activer
    l'authentification au niveau réseau (NLA) et imposer une politique de
    verrouillage des comptes.
  cvss_vecteur: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H
  references:
    - id: CWE-284
      titre: Improper Access Control
      url: https://cwe.mitre.org/data/definitions/284.html
  source: "Rédaction WaveAudit d'après CWE-284, licence du dépôt"

- id: INFRA-LLMNR-NBTNS
  titre: Résolution de noms LLMNR/NBT-NS non désactivée
  famille: infra
  mots_cles:
    - llmnr
    - nbt-ns
    - responder
    - empoisonnement de résolution de noms
    - capture de hachage ntlm
    - broadcast name resolution
  description: >-
    Les protocoles de résolution de noms de secours LLMNR et NBT-NS restent
    actifs sur le réseau, ce qui permet à un attaquant de répondre à la
    place d'un hôte légitime et de capturer des authentifications NTLM.
  impact: >-
    Capture de hachages NTLM réutilisables pour une attaque hors ligne ou un
    relais vers d'autres services.
  recommandation: >-
    Désactiver LLMNR et NBT-NS lorsque la résolution DNS interne est fiable,
    et exiger la signature SMB pour limiter l'impact d'un relais.
  cvss_vecteur: CVSS:3.1/AV:A/AC:H/PR:N/UI:N/S:U/C:H/I:L/A:N
  references:
    - id: CWE-300
      titre: Channel Accessible by Non-Endpoint
      url: https://cwe.mitre.org/data/definitions/300.html
  source: "Rédaction WaveAudit d'après CWE-300, licence du dépôt"

- id: INFRA-IPMI-EXPOSE
  titre: Interface de gestion IPMI exposée sans restriction
  famille: infra
  mots_cles:
    - ipmi exposé
    - interface de gestion hors bande
    - cipher zero
    - identifiants ipmi par défaut
    - bmc accessible
    - ipmitool
    - prise de contrôle hors bande
  description: >-
    L'interface de gestion hors bande IPMI (BMC) est accessible depuis un
    réseau non restreint, parfois avec des identifiants par défaut ou le
    chiffrement `cipher 0` désactivant l'authentification.
  impact: >-
    Prise de contrôle complète du serveur sous-jacent, indépendamment du
    système d'exploitation, via l'interface de gestion hors bande.
  recommandation: >-
    Isoler le réseau de gestion IPMI, changer les identifiants par défaut
    et désactiver les suites de chiffrement non authentifiées.
  cvss_vecteur: CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H
  references:
    - id: CWE-306
      titre: Missing Authentication for Critical Function
      url: https://cwe.mitre.org/data/definitions/306.html
  source: "Rédaction WaveAudit d'après CWE-306, licence du dépôt"

- id: INFRA-NFS-EXPORTE
  titre: Partage NFS exporté sans restriction d'accès
  famille: infra
  mots_cles:
    - nfs exporté
    - nfs export non restreint
    - showmount
    - no_root_squash
    - partage accessible à tous
    - accès réseau large aux partages
    - montage nfs anonyme
  description: >-
    Un partage NFS est exporté vers un réseau large, voire sans
    restriction de client, parfois avec l'option `no_root_squash` qui
    conserve les droits root du client sur le serveur.
  impact: >-
    Lecture ou modification de fichiers partagés par un client non
    autorisé, voire élévation de privilèges sur le serveur via
    `no_root_squash`.
  recommandation: >-
    Restreindre les exports NFS aux hôtes nécessaires, retirer
    `no_root_squash` sauf besoin justifié, et préférer une authentification
    Kerberos lorsque c'est possible.
  cvss_vecteur: CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N
  references:
    - id: CWE-668
      titre: Exposure of Resource to Wrong Sphere
      url: https://cwe.mitre.org/data/definitions/668.html
  source: "Rédaction WaveAudit d'après CWE-668, licence du dépôt"

- id: INFRA-SERVICE-GESTION-EXPOSE
  titre: Interface de gestion d'équipement exposée sur le réseau
  famille: infra
  mots_cles:
    - service de gestion exposé
    - interface d'administration accessible
    - console de gestion exposée
    - management interface exposed
    - accès réseau non restreint à l'administration
    - port de gestion ouvert
    - équipement d'infrastructure administrable à distance
  description: >-
    Une interface d'administration d'équipement (console de gestion de
    serveur, hyperviseur, équipement réseau) est accessible depuis un
    réseau plus large que celui destiné à l'administration.
  impact: >-
    Expose l'interface aux attaques par force brute ou à l'exploitation de
    vulnérabilités connues, avec un impact direct sur l'infrastructure
    gérée.
  recommandation: >-
    Restreindre l'accès aux interfaces de gestion à un réseau
    d'administration dédié, filtré, et accessible uniquement via VPN ou
    bastion.
  cvss_vecteur: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H
  references:
    - id: CWE-284
      titre: Improper Access Control
      url: https://cwe.mitre.org/data/definitions/284.html
  source: "Rédaction WaveAudit d'après CWE-284, licence du dépôt"
