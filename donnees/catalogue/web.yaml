- id: WEB-XSS-REFLECHI
  titre: Injection de script réfléchie (XSS réfléchi)
  famille: web
  mots_cles:
    - xss réfléchi
    - injection de script
    - payload html encodé
    - burp repeater
    - paramètre non échappé
    - vol de session
    - lien forgé
    - échappement de sortie absent
    - résultats de recherche non échappés
    - navigateur jetable
    - chevrons non filtrés
  description: >-
    Un paramètre de requête est renvoyé dans la page sans encodage adapté au
    contexte HTML, ce qui permet d'y injecter du script exécuté par le
    navigateur de la victime au moment où elle ouvre un lien forgé.
  impact: >-
    Vol de session, actions effectuées à l'insu de l'utilisateur ou
    redirection vers un site malveillant, dans le contexte de la page
    vulnérable.
  recommandation: >-
    Encoder toute donnée réinjectée selon son contexte de sortie (HTML,
    attribut, JavaScript), appliquer une politique de sécurité du contenu
    (CSP) stricte et valider les entrées côté serveur.
  en:
    titre: Reflected script injection (reflected XSS)
    description: >-
      A request parameter is echoed back in the page without encoding
      suited to the HTML context, which allows injecting a script that
      the victim's browser runs the moment a crafted link is opened.
    impact: >-
      Session theft, actions carried out without the user's knowledge, or
      redirection to a malicious site, within the vulnerable page's
      context.
    recommandation: >-
      Encode every piece of reinjected data according to its output
      context (HTML, attribute, JavaScript), apply a strict content
      security policy (CSP), and validate input on the server side.
  cvss_vecteur: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
  references:
    - id: CWE-79
      titre: Improper Neutralization of Input During Web Page Generation (XSS)
      url: https://cwe.mitre.org/data/definitions/79.html
    - id: "A03:2021"
      titre: Injection
      url: https://owasp.org/Top10/A03_2021-Injection/
  source: "Rédaction WaveAudit d'après CWE-79 et OWASP Top 10 A03:2021, licence du dépôt"

- id: WEB-XSS-STOCKE
  titre: Injection de script persistante (XSS stocké)
  famille: web
  mots_cles:
    - xss stocké
    - stored xss
    - injection persistante
    - commentaire malveillant
    - champ de formulaire non filtré
    - csp manquante
    - sanitisation html
    - dompurify
  description: >-
    Une donnée saisie par un utilisateur est enregistrée puis restituée sans
    encodage à d'autres visiteurs, ce qui exécute du script arbitraire dans
    leur navigateur dès l'affichage de la page.
  impact: >-
    Compromission de comptes à grande échelle, l'attaque touchant chaque
    visiteur de la page infectée sans action supplémentaire de sa part.
  recommandation: >-
    Encoder systématiquement les données affichées, filtrer ou assainir le
    contenu enrichi autorisé et mettre en place une CSP restrictive.
  en:
    titre: Persistent script injection (stored XSS)
    description: >-
      Data entered by a user is saved and then displayed to other
      visitors without encoding, which runs arbitrary script in their
      browser as soon as the page is shown.
    impact: >-
      Large-scale account compromise, since the attack reaches every
      visitor of the infected page without any further action on their
      part.
    recommandation: >-
      Systematically encode displayed data, filter or sanitize any
      allowed rich content, and put a restrictive CSP in place.
  cvss_vecteur: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:N
  references:
    - id: CWE-79
      titre: Improper Neutralization of Input During Web Page Generation (XSS)
      url: https://cwe.mitre.org/data/definitions/79.html
    - id: "A03:2021"
      titre: Injection
      url: https://owasp.org/Top10/A03_2021-Injection/
  source: "Rédaction WaveAudit d'après CWE-79 et OWASP Top 10 A03:2021, licence du dépôt"

- id: WEB-INJECTION-SQL
  titre: Injection SQL dans les requêtes applicatives
  famille: web
  mots_cles:
    - injection sql
    - sql injection
    - sqlmap
    - requête préparée absente
    - concatenation de requete
    - union select
    - blind sqli
    - time-based injection
    - contournement d'authentification
    - boolean-based
    - sleep / waitfor delay
    - absence de paramétrage
  description: >-
    Une entrée utilisateur est concatenée directement dans une requête SQL,
    ce qui permet à un attaquant d'altérer la logique de la requête exécutée
    par la base de données.
  impact: >-
    Lecture, modification ou suppression de données, contournement
    d'authentification, voire exécution de commandes selon les privilèges du
    compte applicatif.
  recommandation: >-
    Utiliser systématiquement des requêtes préparées ou un ORM paramétré, et
    appliquer le principe de moindre privilège au compte de base de données.
  en:
    titre: SQL injection in application queries
    description: >-
      User input is concatenated directly into an SQL query, which lets
      an attacker alter the logic of the query executed by the database.
    impact: >-
      Reading, modifying, or deleting data, bypassing authentication, or
      even executing commands depending on the application account's
      privileges.
    recommandation: >-
      Systematically use prepared statements or a parameterized ORM, and
      apply the principle of least privilege to the database account.
  cvss_vecteur: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
  references:
    - id: CWE-89
      titre: Improper Neutralization of Special Elements used in an SQL Command
      url: https://cwe.mitre.org/data/definitions/89.html
    - id: "A03:2021"
      titre: Injection
      url: https://owasp.org/Top10/A03_2021-Injection/
  source: "Rédaction WaveAudit d'après CWE-89 et OWASP Top 10 A03:2021, licence du dépôt"

- id: WEB-CSRF
  titre: Falsification de requête inter-site (CSRF)
  famille: web
  mots_cles:
    - csrf
    - cross-site request forgery
    - jeton anti-csrf absent
    - samesite cookie
    - formulaire forgé
    - requête non sollicitée
    - double submit cookie
  description: >-
    Une action sensible côté serveur est déclenchée par une simple requête
    HTTP sans jeton de vérification propre à la session, ce qui permet à un
    site tiers de la rejouer à l'insu de la victime authentifiée.
  impact: >-
    Exécution d'actions non désirées au nom de la victime : changement de
    mot de passe, virement, modification de droits.
  recommandation: >-
    Associer un jeton anti-CSRF imprévisible à chaque action sensible et
    positionner les cookies de session en SameSite=Lax ou Strict.
  en:
    titre: Cross-site request forgery (CSRF)
    description: >-
      A sensitive server-side action is triggered by a plain HTTP request
      with no token tied to the session, which lets a third-party site
      replay it without the authenticated victim's knowledge.
    impact: >-
      Execution of unwanted actions in the victim's name, such as a
      password change, a transfer, or a change of rights.
    recommandation: >-
      Attach an unpredictable anti-CSRF token to every sensitive action
      and set session cookies to SameSite=Lax or Strict.
  cvss_vecteur: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:H/A:N
  references:
    - id: CWE-352
      titre: Cross-Site Request Forgery (CSRF)
      url: https://cwe.mitre.org/data/definitions/352.html
    - id: "A01:2021"
      titre: Broken Access Control
      url: https://owasp.org/Top10/A01_2021-Broken_Access_Control/
  source: "Rédaction WaveAudit d'après CWE-352 et OWASP Top 10 A01:2021, licence du dépôt"

- id: WEB-IDOR
  titre: Référence directe à un objet non vérifiée (IDOR)
  famille: web
  mots_cles:
    - idor
    - insecure direct object reference
    - identifiant séquentiel
    - contrôle d'autorisation manquant
    - accès horizontal
    - broken object level authorization
    - bola
    - numéros séquentiels
    - énumération d'identifiants
    - données d'un autre compte
    - burp autorize
  description: >-
    Un identifiant transmis par le client (numéro de compte, de document) est
    utilisé pour accéder à une ressource sans vérifier que l'utilisateur
    authentifié y a droit.
  impact: >-
    Accès ou modification de données appartenant à d'autres utilisateurs en
    modifiant simplement un identifiant dans la requête.
  recommandation: >-
    Vérifier côté serveur, à chaque accès, que l'utilisateur courant est
    autorisé sur la ressource demandée, indépendamment de l'identifiant
    fourni.
  en:
    titre: Insecure direct object reference (IDOR)
    description: >-
      An identifier supplied by the client (account number, document
      number) is used to access a resource without checking that the
      authenticated user is entitled to it.
    impact: >-
      Access to or modification of data belonging to other users by
      simply changing an identifier in the request.
    recommandation: >-
      Check on the server side, on every access, that the current user
      is authorized on the requested resource, independently of the
      identifier supplied.
  cvss_vecteur: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:L/A:N
  references:
    - id: CWE-639
      titre: Authorization Bypass Through User-Controlled Key
      url: https://cwe.mitre.org/data/definitions/639.html
    - id: "A01:2021"
      titre: Broken Access Control
      url: https://owasp.org/Top10/A01_2021-Broken_Access_Control/
  source: "Rédaction WaveAudit d'après CWE-639 et OWASP Top 10 A01:2021, licence du dépôt"

- id: WEB-SSRF
  titre: Falsification de requête côté serveur (SSRF)
  famille: web
  mots_cles:
    - ssrf
    - server-side request forgery
    - métadonnées cloud
    - 169.254.169.254
    - requête sortante forgée
    - webhook non validé
    - pivot réseau interne
  description: >-
    Le serveur effectue une requête HTTP vers une URL fournie par
    l'utilisateur sans restreindre les destinations possibles, ce qui permet
    d'atteindre des ressources internes normalement inaccessibles.
  impact: >-
    Accès à des services internes, aux métadonnées d'instance cloud ou
    rebond vers d'autres systèmes du réseau interne.
  recommandation: >-
    Restreindre les destinations autorisées par liste blanche, bloquer les
    plages d'adresses privées et de métadonnées, et désactiver les
    redirections automatiques non contrôlées.
  en:
    titre: Server-side request forgery (SSRF)
    description: >-
      The server makes an HTTP request to a URL supplied by the user
      without restricting the possible destinations, which allows
      reaching internal resources normally unreachable.
    impact: >-
      Access to internal services, to cloud instance metadata, or
      pivoting toward other systems on the internal network.
    recommandation: >-
      Restrict allowed destinations with an allow list, block private
      address ranges and metadata ranges, and disable uncontrolled
      automatic redirects.
  cvss_vecteur: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:L/A:N
  references:
    - id: CWE-918
      titre: Server-Side Request Forgery (SSRF)
      url: https://cwe.mitre.org/data/definitions/918.html
    - id: "A10:2021"
      titre: Server-Side Request Forgery (SSRF)
      url: https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/
  source: "Rédaction WaveAudit d'après CWE-918 et OWASP Top 10 A10:2021, licence du dépôt"

- id: WEB-TRAVERSEE-CHEMIN
  titre: Traversée de répertoire (path traversal)
  famille: web
  mots_cles:
    - traversée de répertoire
    - path traversal
    - directory traversal
    - "../"
    - lecture de fichier arbitraire
    - local file inclusion
    - encodage de chemin
  description: >-
    Un nom de fichier fourni par l'utilisateur est utilisé pour construire un
    chemin d'accès disque sans neutraliser les séquences de remontée de
    répertoire, ce qui permet de sortir du dossier prévu.
  impact: >-
    Lecture de fichiers sensibles hors du périmètre attendu (configuration,
    secrets, code source) voire écriture si la fonction le permet.
  recommandation: >-
    Résoudre le chemin final et vérifier qu'il reste sous le répertoire
    autorisé, ou utiliser un identifiant indirect plutôt qu'un chemin brut.
  en:
    titre: Path traversal
    description: >-
      A file name supplied by the user is used to build a disk path
      without neutralizing directory climb-up sequences, which allows
      escaping the intended folder.
    impact: >-
      Reading sensitive files outside the expected scope (configuration,
      secrets, source code), or even writing if the function allows it.
    recommandation: >-
      Resolve the final path and check that it remains under the
      authorized directory, or use an indirect identifier rather than a
      raw path.
  cvss_vecteur: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
  references:
    - id: CWE-22
      titre: Improper Limitation of a Pathname to a Restricted Directory
      url: https://cwe.mitre.org/data/definitions/22.html
    - id: "A01:2021"
      titre: Broken Access Control
      url: https://owasp.org/Top10/A01_2021-Broken_Access_Control/
  source: "Rédaction WaveAudit d'après CWE-22 et OWASP Top 10 A01:2021, licence du dépôt"

- id: WEB-UPLOAD-NON-RESTREINT
  titre: Téléversement de fichier non restreint
  famille: web
  mots_cles:
    - upload non restreint
    - unrestricted file upload
    - webshell
    - extension non vérifiée
    - type mime falsifié
    - double extension
    - dossier d'upload exécutable
  description: >-
    Le service de téléversement accepte des fichiers sans vérifier leur type
    réel ni les stocker hors de portée d'exécution, ce qui permet de déposer
    un script exécutable par le serveur web.
  impact: >-
    Exécution de code arbitraire sur le serveur via un webshell déposé puis
    appelé directement.
  recommandation: >-
    Contrôler le contenu réel du fichier, renommer et stocker les fichiers
    téléversés hors des répertoires exécutables, et limiter les extensions
    acceptées.
  en:
    titre: Unrestricted file upload
    description: >-
      The upload feature accepts files without checking their actual
      type or storing them out of execution reach, which allows planting
      a script the web server can execute.
    impact: >-
      Arbitrary code execution on the server through a webshell dropped
      and then called directly.
    recommandation: >-
      Check the file's actual content, rename and store uploaded files
      outside executable directories, and restrict accepted extensions.
  cvss_vecteur: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H
  references:
    - id: CWE-434
      titre: Unrestricted Upload of File with Dangerous Type
      url: https://cwe.mitre.org/data/definitions/434.html
    - id: "A04:2021"
      titre: Insecure Design
      url: https://owasp.org/Top10/A04_2021-Insecure_Design/
  source: "Rédaction WaveAudit d'après CWE-434 et OWASP Top 10 A04:2021, licence du dépôt"

- id: WEB-SESSION-FIXATION
  titre: Fixation de session utilisateur
  famille: web
  mots_cles:
    - fixation de session
    - session fixation
    - identifiant de session prévisible
    - cookie non régénéré
    - session id dans l'url
    - rotation de session
  description: >-
    L'identifiant de session n'est pas régénéré après authentification, ce
    qui permet à un attaquant d'imposer une valeur connue avant la connexion
    puis de l'utiliser une fois la victime authentifiée.
  impact: >-
    Usurpation de la session d'un utilisateur légitime sans en connaître le
    mot de passe.
  recommandation: >-
    Régénérer l'identifiant de session à chaque changement de niveau de
    privilège (connexion, élévation) et refuser les identifiants fournis par
    le client.
  en:
    titre: User session fixation
    description: >-
      The session identifier is not regenerated after authentication,
      which allows an attacker to impose a known value before login and
      then use it once the victim is authenticated.
    impact: >-
      Hijacking of a legitimate user's session without ever knowing their
      password.
    recommandation: >-
      Regenerate the session identifier at every privilege level change
      (login, escalation) and reject identifiers supplied by the client.
  cvss_vecteur: CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:U/C:H/I:L/A:N
  references:
    - id: CWE-384
      titre: Session Fixation
      url: https://cwe.mitre.org/data/definitions/384.html
    - id: "A07:2021"
      titre: Identification and Authentication Failures
      url: https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/
  source: "Rédaction WaveAudit d'après CWE-384 et OWASP Top 10 A07:2021, licence du dépôt"

- id: WEB-ENTETES-SECURITE
  titre: En-têtes de sécurité HTTP absents
  famille: web
  mots_cles:
    - en-têtes de sécurité
    - security headers
    - content-security-policy
    - x-frame-options
    - hsts manquant
    - x-content-type-options
    - clickjacking
  description: >-
    Les réponses HTTP ne portent pas les en-têtes qui durcissent le
    comportement du navigateur (CSP, HSTS, X-Frame-Options,
    X-Content-Type-Options), laissant le client sans protection par défaut.
  impact: >-
    Facilite d'autres attaques telles que le détournement de clic
    (clickjacking), l'exécution de script injecté ou le dégradé en HTTP.
  recommandation: >-
    Ajouter les en-têtes CSP, HSTS, X-Frame-Options et
    X-Content-Type-Options adaptés à l'application via le serveur ou le
    reverse proxy.
  en:
    titre: Missing HTTP security headers
    description: >-
      HTTP responses do not carry the headers that harden browser
      behaviour (CSP, HSTS, X-Frame-Options, X-Content-Type-Options),
      leaving the client without default protection.
    impact: >-
      Facilitates other attacks such as clickjacking, injected script
      execution, or downgrade to HTTP.
    recommandation: >-
      Add the CSP, HSTS, X-Frame-Options, and X-Content-Type-Options
      headers suited to the application, through the server or the
      reverse proxy.
  cvss_vecteur: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:N/A:N
  references:
    - id: CWE-693
      titre: Protection Mechanism Failure
      url: https://cwe.mitre.org/data/definitions/693.html
    - id: "A05:2021"
      titre: Security Misconfiguration
      url: https://owasp.org/Top10/A05_2021-Security_Misconfiguration/
  source: "Rédaction WaveAudit d'après CWE-693 et OWASP Top 10 A05:2021, licence du dépôt"

- id: WEB-CORS-PERMISSIF
  titre: Partage de ressources inter-origines permissif (CORS)
  famille: web
  mots_cles:
    - cors permissif
    - cross-origin resource sharing
    - access-control-allow-origin *
    - origine reflétée
    - credentials true
    - preflight cors
  description: >-
    La politique CORS reflète dynamiquement l'origine du demandeur ou
    autorise toute origine tout en acceptant les identifiants, ce qui permet
    à un site tiers de lire des réponses destinées à l'utilisateur.
  impact: >-
    Exfiltration de données sensibles vers un site attaquant via une requête
    cross-origin authentifiée.
  recommandation: >-
    Restreindre `Access-Control-Allow-Origin` à une liste explicite d'origines
    de confiance et n'autoriser les identifiants que pour celles-ci.
  en:
    titre: Permissive cross-origin resource sharing (CORS)
    description: >-
      The CORS policy dynamically reflects the requester's origin or
      allows any origin while also accepting credentials, which lets a
      third-party site read responses meant for the user.
    impact: >-
      Exfiltration of sensitive data toward an attacking site through an
      authenticated cross-origin request.
    recommandation: >-
      Restrict `Access-Control-Allow-Origin` to an explicit list of
      trusted origins and allow credentials only for those.
  cvss_vecteur: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:N/A:N
  references:
    - id: CWE-942
      titre: Permissive Cross-domain Policy with Untrusted Domains
      url: https://cwe.mitre.org/data/definitions/942.html
    - id: "A05:2021"
      titre: Security Misconfiguration
      url: https://owasp.org/Top10/A05_2021-Security_Misconfiguration/
  source: "Rédaction WaveAudit d'après CWE-942 et OWASP Top 10 A05:2021, licence du dépôt"

- id: WEB-REDIRECTION-OUVERTE
  titre: Redirection ouverte non contrôlée
  famille: web
  mots_cles:
    - redirection ouverte
    - open redirect
    - paramètre return_url
    - hameçonnage
    - phishing via redirection
    - location non validée
  description: >-
    Un paramètre contrôlé par l'utilisateur détermine l'URL de redirection
    sans vérifier qu'elle appartient au périmètre de l'application.
  impact: >-
    Détournement vers un site de phishing en s'appuyant sur la confiance
    portée au domaine légitime.
  recommandation: >-
    Limiter les redirections à une liste de chemins ou de domaines connus,
    ou afficher une page d'avertissement avant toute redirection externe.
  en:
    titre: Uncontrolled open redirect
    description: >-
      A user-controlled parameter determines the redirect URL without
      checking that it belongs to the application's own scope.
    impact: >-
      Diversion toward a phishing site, relying on the trust placed in
      the legitimate domain.
    recommandation: >-
      Limit redirects to a known list of paths or domains, or show a
      warning page before any external redirect.
  cvss_vecteur: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:N/A:N
  references:
    - id: CWE-601
      titre: URL Redirection to Untrusted Site (Open Redirect)
      url: https://cwe.mitre.org/data/definitions/601.html
    - id: "A01:2021"
      titre: Broken Access Control
      url: https://owasp.org/Top10/A01_2021-Broken_Access_Control/
  source: "Rédaction WaveAudit d'après CWE-601 et OWASP Top 10 A01:2021, licence du dépôt"

- id: WEB-DIVULGATION-ERREURS
  titre: Divulgation d'informations par les messages d'erreur
  famille: web
  mots_cles:
    - divulgation d'erreur
    - stack trace exposée
    - verbose error
    - message de debug
    - chemin serveur révélé
    - version de framework exposée
  description: >-
    Les erreurs applicatives renvoient la trace complète ou des détails
    techniques (chemins, requêtes, versions) directement au client au lieu
    d'un message générique.
  impact: >-
    Fournit à un attaquant des informations qui facilitent la préparation
    d'attaques ciblées (versions vulnérables, structure interne).
  recommandation: >-
    Afficher des messages d'erreur génériques côté client et journaliser le
    détail uniquement côté serveur.
  en:
    titre: Information disclosure through error messages
    description: >-
      Application errors return the full trace or technical details
      (paths, queries, versions) directly to the client instead of a
      generic message.
    impact: >-
      Gives an attacker information that facilitates the preparation of
      targeted attacks (vulnerable versions, internal structure).
    recommandation: >-
      Show generic error messages on the client side and log the detail
      only on the server side.
  cvss_vecteur: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
  references:
    - id: CWE-209
      titre: Generation of Error Message Containing Sensitive Information
      url: https://cwe.mitre.org/data/definitions/209.html
    - id: "A05:2021"
      titre: Security Misconfiguration
      url: https://owasp.org/Top10/A05_2021-Security_Misconfiguration/
  source: "Rédaction WaveAudit d'après CWE-209 et OWASP Top 10 A05:2021, licence du dépôt"

- id: WEB-AUTH-FORCE-BRUTE
  titre: Authentification sans protection contre les essais répétés
  famille: web
  mots_cles:
    - force brute
    - brute force
    - absence de verrouillage de compte
    - credential stuffing
    - rate limiting absent
    - captcha absent
    - bourrage d'identifiants
  description: >-
    Le formulaire d'authentification accepte un nombre illimité de tentatives
    sans délai, verrouillage ni limitation de débit, ce qui permet de tester
    massivement des couples identifiant/mot de passe.
  impact: >-
    Compromission de comptes par essais automatisés, en particulier via des
    listes d'identifiants issues de fuites tierces.
  recommandation: >-
    Introduire une limitation de débit par compte et par source, un
    verrouillage temporaire progressif et une détection des essais massifs.
  en:
    titre: Authentication without protection against repeated attempts
    description: >-
      The login form accepts an unlimited number of attempts without
      delay, lockout, or rate limiting, which allows massively testing
      username and password combinations.
    impact: >-
      Account compromise through automated attempts, in particular using
      credential lists from third-party leaks.
    recommandation: >-
      Introduce rate limiting per account and per source, a progressive
      temporary lockout, and detection of mass attempts.
  cvss_vecteur: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N
  references:
    - id: CWE-307
      titre: Improper Restriction of Excessive Authentication Attempts
      url: https://cwe.mitre.org/data/definitions/307.html
    - id: "A07:2021"
      titre: Identification and Authentication Failures
      url: https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/
  source: "Rédaction WaveAudit d'après CWE-307 et OWASP Top 10 A07:2021, licence du dépôt"

- id: WEB-XXE
  titre: Injection d'entité externe XML (XXE)
  famille: web
  mots_cles:
    - xxe
    - xml external entity
    - entité externe xml
    - doctype non désactivé
    - parseur xml vulnérable
    - lecture de fichier via xml
    - ssrf via xml
  description: >-
    Le parseur XML résout les entités externes déclarées dans un document
    fourni par l'utilisateur, ce qui permet de lire des fichiers locaux ou
    de déclencher des requêtes réseau depuis le serveur.
  impact: >-
    Divulgation de fichiers locaux, déni de service ou SSRF selon la
    configuration du parseur.
  recommandation: >-
    Désactiver la résolution des entités externes et des DTD dans la
    configuration du parseur XML utilisé par l'application.
  en:
    titre: XML external entity injection (XXE)
    description: >-
      The XML parser resolves external entities declared in a document
      supplied by the user, which allows reading local files or
      triggering network requests from the server.
    impact: >-
      Disclosure of local files, denial of service, or SSRF depending on
      the parser's configuration.
    recommandation: >-
      Disable the resolution of external entities and DTDs in the
      configuration of the XML parser used by the application.
  cvss_vecteur: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:L
  references:
    - id: CWE-611
      titre: Improper Restriction of XML External Entity Reference
      url: https://cwe.mitre.org/data/definitions/611.html
    - id: "A05:2021"
      titre: Security Misconfiguration
      url: https://owasp.org/Top10/A05_2021-Security_Misconfiguration/
  source: "Rédaction WaveAudit d'après CWE-611 et OWASP Top 10 A05:2021, licence du dépôt"

- id: WEB-DESERIALISATION
  titre: Désérialisation de données non fiables
  famille: web
  mots_cles:
    - désérialisation non fiable
    - insecure deserialization
    - gadget chain
    - objet sérialisé manipulé
    - pickle non sûr
    - viewstate
    - remote code execution via désérialisation
  description: >-
    L'application désérialise une structure fournie par le client sans en
    vérifier l'origine ni l'intégrité, ce qui permet de reconstruire des
    objets détournant la logique applicative.
  impact: >-
    Exécution de code arbitraire sur le serveur selon les classes
    disponibles dans l'application, ou altération profonde de son état.
  recommandation: >-
    Éviter de désérialiser des données non fiables, préférer des formats
    simples (JSON) et signer ou chiffrer les objets sérialisés sensibles.
  en:
    titre: Deserialization of untrusted data
    description: >-
      The application deserializes a structure supplied by the client
      without checking its origin or integrity, which allows
      reconstructing objects that hijack the application logic.
    impact: >-
      Arbitrary code execution on the server depending on the classes
      available in the application, or deep alteration of its state.
    recommandation: >-
      Avoid deserializing untrusted data, prefer simple formats (JSON),
      and sign or encrypt sensitive serialized objects.
  cvss_vecteur: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H
  references:
    - id: CWE-502
      titre: Deserialization of Untrusted Data
      url: https://cwe.mitre.org/data/definitions/502.html
    - id: "A08:2021"
      titre: Software and Data Integrity Failures
      url: https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/
  source: "Rédaction WaveAudit d'après CWE-502 et OWASP Top 10 A08:2021, licence du dépôt"

- id: WEB-JWT-FAIBLE
  titre: Jeton JWT signé avec un secret faible ou prévisible
  famille: web
  mots_cles:
    - jwt faible
    - weak jwt secret
    - clé de signature jwt
    - algorithme none
    - jwt cracké
    - jwt secret brute force
    - hs256 secret court
    - falsification de jeton
    - token forgé
  description: >-
    Le jeton JWT est signé avec un secret court, par défaut ou devinable, ou
    l'application accepte l'algorithme `none`, ce qui permet de casser la
    signature ou de fabriquer un jeton accepté comme authentique.
  impact: >-
    Usurpation de n'importe quelle identité ou élévation de privilèges par
    falsification d'un jeton accepté comme valide.
  recommandation: >-
    Utiliser un secret long et aléatoire (ou une clé asymétrique), rejeter
    l'algorithme `none` et vérifier explicitement l'algorithme attendu côté
    serveur.
  en:
    titre: JWT signed with a weak or predictable secret
    description: >-
      The JWT is signed with a short, default, or guessable secret, or
      the application accepts the `none` algorithm, which allows
      breaking the signature or forging a token accepted as authentic.
    impact: >-
      Impersonation of any identity or privilege escalation by forging a
      token accepted as valid.
    recommandation: >-
      Use a long, random secret (or an asymmetric key), reject the
      `none` algorithm, and explicitly check the expected algorithm on
      the server side.
  cvss_vecteur: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:N
  references:
    - id: CWE-347
      titre: Improper Verification of Cryptographic Signature
      url: https://cwe.mitre.org/data/definitions/347.html
    - id: "A02:2021"
      titre: Cryptographic Failures
      url: https://owasp.org/Top10/A02_2021-Cryptographic_Failures/
  source: "Rédaction WaveAudit d'après CWE-347 et OWASP Top 10 A02:2021, licence du dépôt"

- id: WEB-CLICKJACKING
  titre: Détournement de clic par superposition de cadre (clickjacking)
  famille: web
  mots_cles:
    - clickjacking
    - détournement de clic
    - iframe invisible
    - superposition de cadre
    - x-frame-options absent
    - frame-ancestors
    - ui redress attack
    - cadre transparent
  description: >-
    La page sensible ne définit pas de protection contre son affichage dans
    un cadre (`X-Frame-Options` ou `frame-ancestors`), ce qui permet de la
    superposer, invisible, sur une page piégée pour détourner les clics de
    la victime.
  impact: >-
    Exécution d'actions sensibles à l'insu de la victime, qui croit cliquer
    sur un élément inoffensif de la page piégée.
  recommandation: >-
    Définir l'en-tête `Content-Security-Policy: frame-ancestors` (ou
    `X-Frame-Options`) sur les pages sensibles pour interdire leur inclusion
    dans un cadre tiers.
  en:
    titre: Clickjacking through frame overlay
    description: >-
      The sensitive page does not set a protection against being
      displayed in a frame (`X-Frame-Options` or `frame-ancestors`),
      which allows overlaying it, invisible, on a trap page to hijack
      the victim's clicks.
    impact: >-
      Execution of sensitive actions without the victim's knowledge,
      believing they are clicking on a harmless element of the trap
      page.
    recommandation: >-
      Set the `Content-Security-Policy: frame-ancestors` header (or
      `X-Frame-Options`) on sensitive pages to forbid their inclusion in
      a third-party frame.
  cvss_vecteur: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:L/A:N
  references:
    - id: CWE-1021
      titre: Improper Restriction of Rendered UI Layers or Frames
      url: https://cwe.mitre.org/data/definitions/1021.html
    - id: "A05:2021"
      titre: Security Misconfiguration
      url: https://owasp.org/Top10/A05_2021-Security_Misconfiguration/
  source: "Rédaction WaveAudit d'après CWE-1021 et OWASP Top 10 A05:2021, licence du dépôt"

- id: WEB-SSTI
  titre: Injection de modèle côté serveur (SSTI)
  famille: web
  mots_cles:
    - ssti
    - server-side template injection
    - moteur de template
    - jinja2 injection
    - expression de template évaluée
    - exécution de code via template
    - tplmap
    - payload d'évaluation arithmétique
    - erreur 500 avec trace du moteur
    - accolades doubles évaluées
    - expression arithmétique dans un champ
  description: >-
    Une entrée utilisateur est insérée directement dans un gabarit évalué
    par le moteur de template côté serveur, ce qui permet d'exécuter des
    expressions voire du code arbitraire.
  impact: >-
    Exécution de code arbitraire sur le serveur, selon les capacités du
    moteur de template utilisé.
  recommandation: >-
    Ne jamais construire de gabarit à partir d'une entrée utilisateur ;
    passer les données en paramètres du template plutôt qu'en code de
    template.
  en:
    titre: Server-side template injection (SSTI)
    description: >-
      User input is inserted directly into a template evaluated by the
      server-side template engine, which allows running expressions or
      even arbitrary code.
    impact: >-
      Arbitrary code execution on the server, depending on the
      capabilities of the template engine in use.
    recommandation: >-
      Never build a template from user input; pass data as template
      parameters rather than as template code.
  cvss_vecteur: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H
  references:
    - id: CWE-1336
      titre: Improper Neutralization of Special Elements Used in a Template Engine
      url: https://cwe.mitre.org/data/definitions/1336.html
    - id: "A03:2021"
      titre: Injection
      url: https://owasp.org/Top10/A03_2021-Injection/
  source: "Rédaction WaveAudit d'après CWE-1336 et OWASP Top 10 A03:2021, licence du dépôt"

- id: WEB-GRAPHQL-INTROSPECTION
  titre: Introspection GraphQL accessible en production
  famille: web
  mots_cles:
    - introspection graphql
    - graphql introspection
    - schéma graphql exposé
    - requête __schema
    - graphql voyager
    - énumération de mutations
    - champs sensibles exposés
    - api graphql non restreinte
  description: >-
    L'API GraphQL accepte les requêtes d'introspection en production,
    dévoilant l'intégralité du schéma, des types, des requêtes et des
    mutations disponibles.
  impact: >-
    Facilite la découverte de fonctionnalités et de champs sensibles non
    documentés, accélérant la préparation d'attaques ciblées sur l'API.
  recommandation: >-
    Désactiver l'introspection GraphQL en production ou la restreindre aux
    environnements de développement authentifiés.
  en:
    titre: GraphQL introspection accessible in production
    description: >-
      The GraphQL API accepts introspection queries in production,
      revealing the entire schema, types, queries, and mutations
      available.
    impact: >-
      Facilitates the discovery of undocumented sensitive features and
      fields, speeding up the preparation of targeted attacks on the
      API.
    recommandation: >-
      Disable GraphQL introspection in production or restrict it to
      authenticated development environments.
  cvss_vecteur: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
  references:
    - id: CWE-200
      titre: Exposure of Sensitive Information to an Unauthorized Actor
      url: https://cwe.mitre.org/data/definitions/200.html
    - id: "A05:2021"
      titre: Security Misconfiguration
      url: https://owasp.org/Top10/A05_2021-Security_Misconfiguration/
  source: "Rédaction WaveAudit d'après CWE-200 et OWASP Top 10 A05:2021, licence du dépôt"
