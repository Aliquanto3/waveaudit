[project]
name = "waveaudit"
version = "0.1.0"
description = "Assistant d'audit cyber hors ligne : notes brutes vers fiches de vulnérabilité (POC)."
readme = "README.md"
license = "Apache-2.0"
requires-python = "==3.12.*"
dependencies = [
    "pydantic==2.14.1",
    "httpx==0.28.1",
    "fastapi==0.143.3",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "typer==0.27.3",
    "pyyaml==6.0.3",
    "python-docx==1.2.0",
    "cvss==3.6",
    "psutil==7.2.2",
    "cyclonedx-bom==7.5.0",  # commande `sbom` (cyclonedx_py lancé par subprocess)
]

[project.scripts]
waveaudit = "waveaudit.interfaces.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-socket==0.8.1",
    "ruff==0.17.1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Jamais --disable-socket (bogue pytest-socket n° 540 avec les serveurs en thread).
addopts = "-m 'not slow' --allow-hosts=127.0.0.1,::1"
markers = [
    "slow: lance le vrai llama-server et les vrais poids (sauté si absents)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".claude", "_bmad", "_bmad-output"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Idiome typer : les valeurs par défaut `typer.Argument(...)`/`typer.Option(...)` sont des appels.
"src/waveaudit/interfaces/cli.py" = ["B008"]
