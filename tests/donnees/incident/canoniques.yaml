  brut: |
    [{"TimeCreated": "2026-10-14T09:16:10+02:00", "Id": 4624, "LogName": "Security", "ProviderName": "Microsoft-Windows-Security-Auditing", "MachineName": "SRV-FICHIERS", "Message": "Ouverture de session d'un compte réussie.", "Data": {"TargetUserName": "administrateur", "IpAddress": "192.0.2.10", "IpPort": 50200, "LogonType": 10}}]
