  brut: |
    [{"TimeCreated": "2026-10-14T08:32:00+02:00", "Id": 4625, "LogName": "Security", "ProviderName": "Microsoft-Windows-Security-Auditing", "MachineName": "SRV-FICHIERS", "Message": "Échec d'ouverture de session d'un compte.", "Data": {"TargetUserName": "j.dupont", "IpAddress": "::ffff:192.0.2.10", "LogonType": "3"}}]
