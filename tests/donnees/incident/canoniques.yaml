# Événements canoniques du workflow incident (C1, contrats §21, formats-incident.md).
#
# Traduction testable de formats-incident.md, où C2 (lecture), C3 (règles) et C4 (indicateurs)
# se rencontrent sans se lire. Chaque entrée :
#   id        identifiant stable de l'entrée
#   fichier   nom routable du fichier minimal (security.json, system.json, sysmon.csv, auth.log)
#   brut      contenu complet de ce fichier : tableau JSON d'un objet, en-tête CSV + un
#             enregistrement, ou une ligne syslog
#   ligne     1 (JSON, syslog) ; 2 (CSV : l'en-tête est la ligne 1)
#   evenement Evenement attendu, sans fichier ni ligne, lu avec annee=2026 et +02:00
#   regles    ids des règles du catalogue minimal dont la CONDITION est vraie (agrégation à
#             part : un 4625 isolé vérifie la condition de INC-WIN-FORCE-BRUTE) ; peut être vide
#
# Entrées chrono-* : une par ligne de la « Chronologie d'attaque normative » (17) ; pour les
# lignes répétées (force brute), la première occurrence. Entrées benin-* : voisines bénignes.
# Entrées norm-* : cas de normalisation des champs et de la lecture.

# --- Chronologie d'attaque normative (2026-10-14, +02:00) ---------------------------------

